name: Publish pacman repository

# Publishes the signed [nodalix] pacman repository to GitHub Pages.
# Browser updates are published automatically only from a successful, current
# main-branch CI candidate, after the reviewed Brújula PKGBUILD is merged.
# Manual publication of any successful main-branch CI run remains supported.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Id of the CI run whose nodalix-0.4.0-candidate packages are published
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-pacman-repo
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.repository == 'getnodalia/nodalix-os' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      candidate_run: ${{ steps.check.outputs.candidate_run }}
    steps:
      - name: Validate the current main-branch CI candidate
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ github.event.workflow_run.id || inputs.candidate_run }}
        run: |
          set -euo pipefail
          [[ $CANDIDATE_RUN =~ ^[0-9]+$ ]] || exit 1
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN")
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$main_sha" '
            .path == ".github/workflows/ci.yml"
            and .head_repository.full_name == $repo
            and .head_branch == "main"
            and .head_sha == $sha
            and .event == "push"
            and .status == "completed"
            and .conclusion == "success"' <<<"$run" >/dev/null
          echo "candidate_run=$CANDIDATE_RUN" >> "$GITHUB_OUTPUT"
          if [[ $GITHUB_EVENT_NAME == workflow_run ]]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/commits/$main_sha" --jq '.files[].filename')
            if ! grep -Fxq 'packaging/nodalix-brujula/PKGBUILD' <<<"$files"; then
              echo 'No independent Brújula package update in the main commit'
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    # Only validated main CI candidates reach the signing environment.
    if: needs.preflight.outputs.publish == 'true'
    # Keep the repository signing secrets in the environment, main branch only.
    environment: nodalix-repo-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Require a successful CI run of this repository on main
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ needs.preflight.outputs.candidate_run }}
        run: |
          [[ $CANDIDATE_RUN =~ ^[0-9]+$ ]] || { echo 'candidate_run must be a numeric run id'; exit 1; }
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN")
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .path == ".github/workflows/ci.yml"
            and .head_repository.full_name == $repo
            and .head_branch == "main"
            and .event == "push"
            and .status == "completed"
            and .conclusion == "success"' <<<"$run" >/dev/null || {
            echo "Run $CANDIDATE_RUN is not a successful CI run of $GITHUB_REPOSITORY on main" >&2
            exit 1
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nodalix-0.4.0-candidate
          path: dist/packages
          run-id: ${{ needs.preflight.outputs.candidate_run }}
          github-token: ${{ github.token }}
      - name: Sign the packages and build the repository
        env:
          NODALIX_REPO_GPG_KEY: ${{ secrets.NODALIX_REPO_GPG_KEY }}
          NODALIX_REPO_GPG_PASSPHRASE: ${{ secrets.NODALIX_REPO_GPG_PASSPHRASE }}
        run: |
          docker run --rm -e NODALIX_CI_CONTAINER=1 \
            -e NODALIX_REPO_GPG_KEY -e NODALIX_REPO_GPG_PASSPHRASE \
            -v "$PWD":/src -w /src archlinux:latest bash tools/ci-publish-repo.sh
          sudo chown -R "$(id -u):$(id -g)" dist/pages
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist/pages
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
